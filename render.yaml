# Render.com — backend API + WebSocket (required alongside Netlify frontend)
# Deploy: connect GitHub repo → New Blueprint → select render.yaml

services:
  - type: web
    name: gloobloom-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        value: file:./prisma/prod.db
      - key: FRONTEND_URL
        value: https://aesthetic-sprite-583fdb.netlify.app
      - key: ADMIN_SECRET
        generateValue: true
      - key: ADMIN_PANEL_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_DEV_TLS_RELAXED
        value: "false"
      - key: DECAY_INTERVAL_MS
        value: 60000
      - key: HYDRATION_LOSS_PER_MINUTE
        value: 0.5
      - key: GROWTH_PER_WATERING
        value: 2.5

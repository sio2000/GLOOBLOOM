# Render.com — backend API + WebSocket (required alongside Netlify frontend)
# Deploy: connect GitHub repo → New Blueprint → select render.yaml

services:
  - type: web
    name: gloobloom-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    # NODE_ENV=production skips devDeps — prisma CLI lives in devDependencies
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma db push --skip-generate && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        value: file:./prisma/prod.db
      # Canonical site URL(s). Comma-separated list allowed. Any *.netlify.app
      # origin is accepted automatically (see lib/corsOrigins.ts), so rotating
      # Netlify URLs no longer break CORS — keep the primary one first.
      - key: FRONTEND_URL
        value: https://regal-pika-842773.netlify.app,https://aesthetic-sprite-583fdb.netlify.app
      - key: ADMIN_SECRET
        value: gloobloom-admin-secret-change-me
      - key: ADMIN_PANEL_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_DEV_TLS_RELAXED
        value: "false"
      - key: DECAY_INTERVAL_MS
        value: 60000
      - key: HYDRATION_LOSS_PER_MINUTE
        value: 0.5
      - key: GROWTH_PER_WATERING
        value: 2.5

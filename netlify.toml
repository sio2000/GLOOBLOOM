# Netlify — frontend (Next.js 14)
# Repo: https://github.com/sio2000/GLOOBLOOM

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Admin dashboard: https://YOUR-SITE.netlify.app/admin
